server:
  port: 8080

spring:
  application:
    name: titration-backend

  # H2 内存数据库（开发环境，无需安装 MySQL）
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:titration_detection;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 200MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: titration-detection-system-jwt-secret-key-2026-graduation-project
  expiration: 86400000

file:
  storage:
    root-path: ./storage
    max-file-size: 104857600

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc.html
