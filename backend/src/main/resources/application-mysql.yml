# MySQL 8 生产环境配置
# 启动方式: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=mysql
# 或: java -jar target/titration-1.0.0.jar --spring.profiles.active=mysql
server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/titration_detection?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root

  h2:
    console:
      enabled: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-mysql.sql
      data-locations: classpath:data-mysql.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: titration-detection-system-jwt-secret-key-2026-graduation-project
  expiration: 86400000

file:
  storage:
    root-path: ./storage
    max-file-size: 104857600

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc.html
